[project]
name = "gradpath"
version = "0.1.0"
description = "GradPath AI backend: adaptive RAG + LangGraph career-preparation workflow"
requires-python = ">=3.13,<3.15"
dependencies = [
    "anthropic==2.10.0",
    "beautifulsoup4>=4.15.0",
    "claude-agent-sdk==0.2.184",
    "fastapi==0.163.2",
    "fastembed==0.9.1",
    "httpx>=0.28.1",
    "langchain-anthropic==1.7.10",
    "langchain-core==1.8.2",
    "langchain-qdrant==1.1.0",
    "langchain-text-splitters==1.1.3",
    "langchain-voyageai==0.4.1",
    "langgraph==1.2.22",
    "langsmith==0.15.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "pypdf==7.1.0",
    "qdrant-client==1.20.0",
    "uvicorn>=0.54.0",
    "voyageai==0.6.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-html>=4.2.0",
    "ruff>=0.17.5",
]
