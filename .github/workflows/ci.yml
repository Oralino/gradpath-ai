# Lint and test the backend on every push and pull request. No secrets: tests use the fake LLM
# provider, fake embeddings and in-memory Qdrant, so CI costs nothing and calls no paid API.
name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # Belt and braces: nothing in CI may call a model or send traces.
      LLM_PROVIDER: fake
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          python-version: "3.13"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install (exactly what uv.lock pins)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q
